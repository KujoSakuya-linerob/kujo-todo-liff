
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>九條先生｜待辦清單</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f5f6f8;
      color: #242833;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 20px;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .subtitle,
    .note {
      color: #707783;
      line-height: 1.7;
    }

    .subtitle {
      font-size: 14px;
      margin-bottom: 22px;
    }

    .count {
      margin-bottom: 12px;
      font-size: 14px;
      color: #46566f;
    }

    .todo-list {
      display: grid;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      line-height: 1.6;
      cursor: pointer;
    }

    .todo-item:has(input:checked) {
      border-color: #496b9a;
      background: #f3f7fc;
    }

    .todo-item input {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      margin-top: 2px;
      accent-color: #496b9a;
    }

    .todo-content {
      overflow-wrap: anywhere;
    }

    .actions {
      margin-top: 22px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #496b9a;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      background: #c6ccd5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 16px;
      font-size: 12px;
    }

    .tag {
      display: inline-block;
      margin-bottom: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef2f7;
      color: #46566f;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="tag">九條先生的工作助理</div>

    <h1>待辦清單</h1>

    <div class="subtitle">
      請勾選要完成的項目，確認後一次送出。
    </div>

    <div class="count" id="count">已選 0 項</div>

    <div class="todo-list" id="todoList"></div>

    <div class="actions">
      <button id="confirmButton" type="button" disabled>
        確認完成
      </button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite">
      正在初始化 LIFF……
    </div>

    <div class="note">
      目前為測試模式。勾選與確認只會顯示預覽結果，
      不會修改真實待辦資料。
    </div>
  </main>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    /*
     * 第一步：填入自己的 LIFF ID。
     *
     * 請從 LINE Developers 後台複製 LIFF ID，
     * 直接貼在下方引號內。
     *
     * 不要填入 LIFF URL，也不要填入 Apps Script URL。
     */
    const LIFF_ID = "2012167437-rTi7982A";

    /*
     * 測試用待辦資料。
     * 此版本尚未連線 Google 試算表。
     */
    const demoTodos = [
      {
        id: "demo-1",
        content: "整理研究稽核資料"
      },
      {
        id: "demo-2",
        content: "確認會議紀錄"
      },
      {
        id: "demo-3",
        content: "追蹤待處理事項"
      }
    ];

    const selectedIds = new Set();

    const todoList = document.getElementById("todoList");
    const count = document.getElementById("count");
    const confirmButton = document.getElementById("confirmButton");
    const status = document.getElementById("status");

    /*
     * 第二步：初始化 LIFF 並檢查登入狀態。
     *
     * 此處不讀取 LINE 使用者 ID，
     * 不傳送登入憑證，也不呼叫任何待辦後端。
     */

async function initializeLiff() {
  try {
    if (
      !LIFF_ID ||
      LIFF_ID === "2012167437-rTi7982A"
    ) {
      status.textContent =
        "2012167437-rTi7982A";
      return;
    }

    await liff.init({
      liffId: LIFF_ID
    });

if (liff.isLoggedIn()) {
  status.textContent = "正在驗證 LINE 登入狀態…";

  const idToken = liff.getIDToken();

  if (!idToken) {
    status.textContent =
      "無法取得 LINE ID Token。\n" +
      "請確認 LIFF 已啟用 openid 權限，並重新登入。";
    return;
  }

  const response = await fetch(
    "https://kujo-todo-api.hting07092.workers.dev/api/verify",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ idToken })
    }
  );

  const result = await response.json();

  if (!response.ok || result.authenticated !== true) {
    status.textContent =
      "LINE 登入驗證失敗（HTTP " +
      response.status +
      "）。\n請重新登入，或檢查 Worker 設定。";
    return;
  }

  status.textContent =
    "LINE 登入驗證成功！\n" +
    "目前仍為測試模式，尚未連接真實待辦資料。";
  return;
}

    if (!liff.isInClient()) {
      status.textContent =
        "目前尚未登入 LINE，請點擊下方按鈕登入。";

      const loginButton = document.createElement("button");
      loginButton.type = "button";
      loginButton.textContent = "使用 LINE 登入";
      loginButton.style.marginTop = "12px";

      loginButton.addEventListener("click", () => {
        liff.login({
          redirectUri: window.location.href
        });
      });

      status.appendChild(loginButton);
      return;
    }

    status.textContent =
      "請從 LINE 聊天室內開啟此 LIFF 頁面。";
  } catch (error) {
    console.error("LIFF 初始化失敗：", error);

    status.textContent =
      "LIFF 初始化失敗。\n" +
      "請檢查 LIFF ID、Endpoint URL 與 LINE Login 設定。";
  }
}

    /*
     * 第三步：更新勾選數量與按鈕狀態。
     */
    function updateSelection() {
      count.textContent = `已選 ${selectedIds.size} 項`;

      confirmButton.disabled = selectedIds.size === 0;
    }

    /*
     * 第四步：顯示待辦清單。
     */
    function renderTodos() {
      todoList.replaceChildren();

      demoTodos.forEach(todo => {
        const label = document.createElement("label");
        label.className = "todo-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = todo.id;
        checkbox.setAttribute(
          "aria-label",
          `選取待辦：${todo.content}`
        );

        checkbox.addEventListener("change", () => {
          if (checkbox.checked) {
            selectedIds.add(todo.id);
          } else {
            selectedIds.delete(todo.id);
          }

          updateSelection();
        });

        const text = document.createElement("span");
        text.className = "todo-content";
        text.textContent = todo.content;

        label.append(checkbox, text);
        todoList.appendChild(label);
      });

      updateSelection();
    }

    /*
     * 第五步：一次確認所有已勾選項目。
     *
     * 目前只產生預覽訊息，不會完成真實待辦。
     */
    confirmButton.addEventListener("click", () => {
      const selectedContents = demoTodos
        .filter(todo => selectedIds.has(todo.id))
        .map(todo => "・" + todo.content);

      if (selectedContents.length === 0) {
        status.textContent = "請先選取至少一項待辦。";
        return;
      }

      status.textContent =
        `介面預覽：已選取 ${selectedContents.length} 項。\n\n` +
        selectedContents.join("\n") +
        "\n\n目前尚未送出至後端，也不會修改 Google 試算表。";
    });

    /*
     * 第六步：顯示測試資料並啟動 LIFF。
     */
    renderTodos();
    initializeLiff();
  </script>
  
<div style="margin:16px 0;padding:12px;border:1px solid #ccc;border-radius:8px;">
  <button id="workerTestButton" type="button">測試 Worker 連線</button>
  <pre id="workerTestResult" style="white-space:pre-wrap;"></pre>
</div>

<script>
(() => {
  const button = document.getElementById("workerTestButton");
  const output = document.getElementById("workerTestResult");
  if (!button || !output) return;

  button.addEventListener("click", async () => {
    button.disabled = true;
    output.textContent = "測試中…";

    try {
      const response = await fetch(
        "https://kujo-todo-api.hting07092.workers.dev/api/verify",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken: "invalid-test-token" })
        }
      );

      output.textContent =
        `HTTP ${response.status}\n` + await response.text();
    } catch (error) {
      output.textContent = "請求失敗：" + error.message;
    } finally {
      button.disabled = false;
    }
  });
})();
</script>

</body>
</html>
